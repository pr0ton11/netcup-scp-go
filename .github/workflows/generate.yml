name: Generate netcup SCP Go Client

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Fetch latest OpenAPI spec
        run: make fetch-spec

      - name: Patch spec
        run: make patch-spec

      - name: Generate client
        run: go generate ./...

      - name: Tidy modules
        run: go mod tidy

      - name: Verify build
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: regenerate client from latest netcup SCP OpenAPI spec"
          title: "chore: update generated netcup SCP API client"
          body: |
            This PR was automatically generated by the [Generate netcup SCP Go Client](../actions/workflows/generate.yml) workflow.

            It updates the generated Go client code based on the latest [netcup SCP OpenAPI spec](https://www.servercontrolpanel.de/scp-core/api/v1/openapi).

            Please review the changes to ensure compatibility.
          branch: chore/update-generated-client
          delete-branch: true
          labels: automated,dependencies
